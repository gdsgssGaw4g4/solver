name: cfinspect3
on:
  workflow_dispatch:
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: watch
        run: |
          echo "runner ip: $(curl -sS https://api.ipify.org)"
          for i in $(seq 1 30); do
            out=$(curl -sS -D h.txt -o b.html -w "%{http_code}" https://velor.win/ || true)
            mit=$(grep -i "cf-mitigated" h.txt | tr -d "\r")
            t=$(grep -o "<title>[^<]*</title>" b.html | head -1)
            echo "[$i] $(date -u +%H:%M:%S) code=$out $mit $t"
            sleep 45
          done